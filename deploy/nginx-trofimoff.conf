server {
    listen 80;
    listen [::]:80;
    server_name trofimoff.tdistina.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trofimoff.tdistina.ru;

    root /var/www/trofimoff.tdistina.ru/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/trofimoff.tdistina.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trofimoff.tdistina.ru/privkey.pem;

    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
